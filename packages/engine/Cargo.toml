[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.1", default-features = false, features = ["v4"] }

[profile.release]
panic = "abort" # this will kill the complete architecture in an instant when panic occurs, without clean shutdown

